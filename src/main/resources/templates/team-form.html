<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${team.id == null} ? 'Add Team' : 'Edit Team'">Team</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 50px 20px; color: #1f2937; }
        .container { max-width: 520px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        h1 { margin: 0 0 24px; font-size: 24px; color: #111827; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
        input:focus { outline: none; border-color: #2563eb; }
        .buttons { display: flex; gap: 10px; align-items: center; }
        button { background: #2563eb; color: #fff; border: none; padding: 11px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        button:hover { background: #1d4ed8; }
        .cancel { color: #6b7280; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${team.id == null} ? 'Add New Team' : 'Edit Team'">Team</h1>
    <form th:action="${team.id == null} ? @{/teams} : @{/teams/{id}(id=${team.id})}" method="post">
        <label for="name">Team name</label>
        <input type="text" id="name" name="name" th:value="${team.name}" required>

        <label for="managerName">Manager name</label>
        <input type="text" id="managerName" name="managerName" th:value="${team.managerName}" required>

        <div class="buttons">
            <button type="submit">Save</button>
            <a class="cancel" href="/teams">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
