<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Player Management</title>
    <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation(active='players')}"></div>

<main>
    <div class="header">
        <div>
            <h1>Player Management</h1>
            <p class="subtitle">Manage the players in each team's squad.</p>
        </div>
        <a class="btn-primary" th:href="@{/players/new}">+ Add New Player</a>
    </div>

    <div class="card">
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Position</th>
                <th>Shirt</th>
                <th>Team</th>
                <th>Actions</th>
            </tr>
            <tr th:if="${#lists.isEmpty(players)}">
                <td class="empty" colspan="6">No players yet. Add your first player.</td>
            </tr>
            <tr th:each="player : ${players}">
                <td class="id" th:text="${player.id}"></td>
                <td class="name" th:text="${player.firstName + ' ' + player.lastName}"></td>
                <td th:text="${player.position}"></td>
                <td><span class="badge" th:text="${player.shirtNumber}"></span></td>
                <td th:text="${player.team.name}"></td>
                <td>
                    <div class="actions">
                        <a class="btn-edit" th:href="@{/players/{id}/edit(id=${player.id})}">Edit</a>
                        <form class="inline-form" th:action="@{/players/{id}/delete(id=${player.id})}" method="post"
                              onsubmit="return confirm('Delete this player?');">
                            <button class="btn-delete" type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <p class="footer">Five-a-side League Manager</p>
</main>

</body>
</html>
