<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create User</title>
  <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation(active='admin')}"></div>

<main>
  <div class="form-card">
    <h1>Create User Account</h1>

    <form th:action="@{/admin/users}" th:object="${userForm}" method="post">
      <div class="form-field">
        <label for="username">Username</label>
        <input id="username" type="text" th:field="*{username}">
        <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="form-field">
        <label for="role">Role</label>
        <select id="role" th:field="*{role}">
          <option value="">Select role</option>
          <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
      </div>

      <div class="buttons">
        <button class="btn-save" type="submit">Create User</button>
        <a class="cancel" th:href="@{/admin/users}">Cancel</a>
      </div>
    </form>
  </div>
</main>

</body>
</html>
