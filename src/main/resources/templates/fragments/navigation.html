<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navigation(active)">
    <a th:href="@{/}" th:classappend="${active == 'home'} ? 'active'">Home</a>
    <a th:href="@{/teams}" th:classappend="${active == 'teams'} ? 'active'">Teams</a>
    <a th:href="@{/players}" th:classappend="${active == 'players'} ? 'active'">Players</a>

    <div class="nav-end" sec:authorize="isAuthenticated()">
        <span class="nav-user" sec:authentication="name">username</span>
        <form th:action="@{/logout}" method="post" class="inline-form">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>

    <a class="nav-end" th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
</nav>

</body>
</html>
