<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Team</title>
  <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation(active='teams')}"></div>

<main>
  <div class="form-card">
    <h1>Edit Team</h1>

    <form th:action="@{/teams/{id}(id=${teamId})}" th:object="${teamForm}" method="post">
      <div class="form-field">
        <label for="name">Team name</label>
        <input id="name" type="text" th:field="*{name}">
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <div class="form-field">
        <label for="managerName">Manager name</label>
        <input id="managerName" type="text" th:field="*{managerName}">
        <div class="error" th:if="${#fields.hasErrors('managerName')}" th:errors="*{managerName}"></div>
      </div>

      <div class="buttons">
        <button class="btn-save" type="submit">Save</button>
        <a class="cancel" th:href="@{/teams}">Cancel</a>
      </div>
    </form>
  </div>

  <div class="card squad-card">
    <h2>Squad</h2>
    <table>
      <thead>
      <tr>
        <th>Name</th>
        <th>Position</th>
        <th>Shirt</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="player : ${squad}">
        <td th:text="${player.firstName + ' ' + player.lastName}">Name</td>
        <td th:text="${player.position}">Position</td>
        <td th:text="${player.shirtNumber}">10</td>
      </tr>
      <tr th:if="${#lists.isEmpty(squad)}">
        <td colspan="3" class="empty">No players in this team yet.</td>
      </tr>
      </tbody>
    </table>

    <form th:if="${!#lists.isEmpty(availablePlayers)}"
          th:action="@{/teams/{id}/players(id=${teamId})}" method="post" class="assign-form">
      <select name="playerId">
        <option th:each="player : ${availablePlayers}"
                th:value="${player.id}"
                th:text="${player.firstName + ' ' + player.lastName + ' (' + player.team.name + ')'}">Player</option>
      </select>
      <button type="submit" class="btn-save">Add to team</button>
    </form>
  </div>
</main>

</body>
</html>
