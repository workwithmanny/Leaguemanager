<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Team Management</title>
  <link rel="stylesheet" th:href="@{/css/application.css}">
</head>
<body>

<div th:replace="~{fragments/navigation :: navigation(active='teams')}"></div>

<main>
  <div class="header">
    <div>
      <h1>Team Management</h1>
      <p class="subtitle">Register and manage the teams in your five-a-side league.</p>
    </div>
    <a class="btn-primary" th:href="@{/teams/new}">+ Add New Team</a>
  </div>

  <div class="alert" th:if="${param.deleteError}">
    This team still has players, so it can't be deleted. Delete or move its players first.
  </div>

  <div class="card">
    <table>
      <tr>
        <th>ID</th>
        <th>Team name</th>
        <th>Manager</th>
        <th>Actions</th>
      </tr>
      <tr th:if="${#lists.isEmpty(teams)}">
        <td class="empty" colspan="4">No teams yet. Add your first team.</td>
      </tr>
      <tr th:each="team : ${teams}">
        <td class="id" th:text="${team.id}"></td>
        <td class="name" th:text="${team.name}"></td>
        <td th:text="${team.managerName}"></td>
        <td>
          <div class="actions">
            <a class="btn-edit" th:href="@{/teams/{id}/edit(id=${team.id})}">Edit</a>
            <form class="inline-form" th:action="@{/teams/{id}/delete(id=${team.id})}" method="post"
                  onsubmit="return confirm('Delete this team?');">
              <button class="btn-delete" type="submit">Delete</button>
            </form>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <p class="footer">Five-a-side League Manager</p>
</main>

</body>
</html>
