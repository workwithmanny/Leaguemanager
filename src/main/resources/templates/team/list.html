<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Team Management</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f5f7fb; margin: 0; padding: 50px 20px; color: #1f2937; }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
    h1 { margin: 0 0 8px; font-size: 28px; color: #111827; }
    .subtitle { margin: 0; color: #6b7280; font-size: 14px; }
    .btn-primary { background: #2563eb; color: #fff; padding: 11px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
    .btn-primary:hover { background: #1d4ed8; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 18px 24px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #6b7280; border-bottom: 1px solid #eef0f4; }
    td { padding: 22px 24px; font-size: 14px; border-bottom: 1px solid #f1f3f7; }
    tr:last-child td { border-bottom: none; }
    .id { color: #9ca3af; }
    .name { font-weight: 600; color: #111827; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .actions { display: flex; gap: 8px; }
    .actions form { margin: 0; }
    .btn-edit, .btn-delete { border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; font-family: inherit; }
    .btn-edit { background: #eff6ff; color: #1d4ed8; }
    .btn-edit:hover { background: #dbeafe; }
    .btn-delete { background: #fef2f2; color: #dc2626; }
    .btn-delete:hover { background: #fee2e2; }
    .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 30px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Team Management</h1>
      <p class="subtitle">Register and manage the teams in your five-a-side league.</p>
    </div>
    <a class="btn-primary" href="/teams/new">+ Add New Team</a>
  </div>

  <div class="card">
    <table>
      <tr>
        <th>ID</th>
        <th>Team name</th>
        <th>Manager</th>
        <th>Actions</th>
      </tr>
      <tr th:if="${#lists.isEmpty(teams)}">
        <td class="empty" colspan="4">No teams yet. Add your first team.</td>
      </tr>
      <tr th:each="team : ${teams}">
        <td class="id" th:text="${team.id}"></td>
        <td class="name" th:text="${team.name}"></td>
        <td th:text="${team.managerName}"></td>
        <td>
          <div class="actions">
            <a class="btn-edit" th:href="@{/teams/{id}/edit(id=${team.id})}">Edit</a>
            <form th:action="@{/teams/{id}/delete(id=${team.id})}" method="post"
                  onsubmit="return confirm('Delete this team?');">
              <button class="btn-delete" type="submit">Delete</button>
            </form>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <p class="footer">Five-a-side League Manager</p>
</div>
</body>
</html>
